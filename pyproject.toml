[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "repo-qa"
version = "0.1.0"
description = "Grounded, cited question answering over a local code repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shahid Ul Islam" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer==0.28.0",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "pathspec==1.1.1",
    "numpy==2.5.4",
    "fastembed==0.9.1",
    # 0.26.0 corrupts the heap on Windows (access violation while walking parsed trees);
    # 0.25.2 is stable with the same grammars. Re-test before bumping.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-java==0.23.5",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
]

[project.optional-dependencies]
anthropic = ["anthropic==2.6.0"]
openai = ["openai==3.46.0"]
dev = ["pytest==9.2.0", "ruff==0.17.4", "httpx==0.28.1"]

[project.scripts]
repo-qa = "repo_qa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_qa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
